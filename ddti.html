<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDTI 梦境深度类型指标问卷</title>
    <style>
        /* ================= MBTI 风格模仿 ================= */
        :root {
            --bg-color: #f4f6f8;
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-bg: #dc2626;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.5s, color 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
@keyframes blink {
    0% { opacity: 0.3; }
    100% { opacity: 1; }
}
        /* ================= 黑底红字（资格审查状态） ================= */
        body.audit-mode {
            background-color: #000000 !important;
            color: #ff0000 !important;
        }
        body.audit-mode .option-btn {
            border-color: #ff0000 !important;
            color: #ff0000 !important;
        }
        body.audit-mode .option-btn:hover {
            background-color: #ff0000 !important;
            color: #ffffff !important;
        }
        body.audit-mode .question-title {
            color: #ff0000 !important;
            border-bottom-color: #ff0000 !important;
        }
        body.audit-mode .progress-bar-fill {
            background-color: #ff0000 !important;
        }

        /* ================= 容器 ================= */
        .container {
            width: 100%;
            max-width: 720px;
            background: var(--white);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 40px;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            transition: background-color 0.5s, color 0.5s;
        }
        body.audit-mode .container {
            background: rgba(0,0,0,0.8);
            border: 1px solid #ff0000;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        /* 进度条 */
        .progress-container {
            margin-bottom: 30px;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 题目 */
        .question-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 30px;
            color: var(--text-main);
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            transition: color 0.5s, border-color 0.5s;
        }

        /* 选项 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px 20px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: var(--text-main);
        }
        .option-btn:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        /* 覆盖层（耳语、醒来、BGM等） */
        .overlay-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: 900;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .overlay-screen.show {
            opacity: 1;
            pointer-events: all;
        }
        .whisper-text {
            font-size: 20px;
            color: #ccc;
            font-style: italic;
        }
        .red-alert {
            color: var(--danger);
            font-size: 46px;
            animation: shake 0.3s infinite;
        }
        @keyframes shake {
            0% { transform: translate(2px, 2px) rotate(0deg); }
            25% { transform: translate(-2px, -2px) rotate(1deg); }
            75% { transform: translate(2px, -2px) rotate(-1deg); }
            100% { transform: translate(-2px, 2px) rotate(0deg); }
        }

        /* 输入框 */
        .input-group {
            margin-top: 20px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background: var(--bg-color);
        }

        /* 结果页面 */
        .result-box {
            text-align: center;
        }
        .result-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .result-desc {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
        .type-badge {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        /* ===== 灾难倒计时故障通知 ===== */
        .disaster-notice {
            position: fixed;
            top: -100px;
            left: 0;
            width: 100%;
            background: #8a0303;
            color: #fff;
            padding: 18px 0;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(138, 3, 3, 0.5);
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .disaster-notice.show {
            top: 0;
        }
        .disaster-notice.glitch {
            animation: glitchEffect 0.2s infinite;
        }
        @keyframes glitchEffect {
            0% { transform: translate(2px, 2px); opacity: 0.8; background: #a00000; }
            25% { transform: translate(-2px, -2px); opacity: 1; background: #cc0000; }
            50% { transform: translate(2px, -2px); opacity: 0.9; background: #8a0303; }
            75% { transform: translate(-2px, 2px); opacity: 1; background: #d40000; }
            100% { transform: translate(2px, 2px); opacity: 0.8; background: #a00000; }
        }
        .alert-icon {
            font-size: 26px;
            margin-right: 10px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

         function calculateZodiac(dateStr) {
            if (!dateStr) return "未知";
            
            const date = new Date(dateStr);

            const day = date.getDate();
            
            const zodiacs = [
                { name: '摩羯座', start: [12, 22], end: [1, 19] },
                { name: '水瓶座', start: [1, 20], end: [2, 18] },
                { name: '双鱼座', start: [2, 19], end: [3, 20] },

                { name: '金牛座', start: [4, 20], end: [5, 20] },

                { name: '巨蟹座', start: [6, 22], end: [7, 22] },
                { name: '狮子座', start: [7, 23], end: [8, 22] },

            for (let i = 0; i < zodiacs.length; i++) {
                const z = zodiacs[i];
                const startM = z.start[0], startD = z.start[1];
                const endM = z.end[0], endD = z.end[1];

                if ((month === startM && day >= startD) || (month === endM && day <= endD)) {
                    return z.name;
                }
            }
            return "未知";
        }

            { type: 'choice', title: '22. 您是否会担心自己“今晚又睡不好”而产生焦虑', options: [{t:'A.非常认同',v:-2},{t:'B.认同',v:-1},{t:'C.不认同',v:1},{t:'D.非常不认同',v:2}] },
            { type: 'choice', title: '23. 您的星座是 ' + (window.__userZodiac || '未知'), options: [{t:'A.非常认同',v:-2},{t:'B.认同',v:-1},{t:'C.不认同',v:1},{t:'D.非常不认同',v:2}] },

            { type: 'choice', title: '26. 您在入睡经常胡思乱想', options: [{t:'A.非常认同',v:-2},{t:'B.认同',v:-1},{t:'C.不认同',v:1},{t:'D.非常不认同',v:2}] },

            { type: 'choice', title: '28. 您认为睡眠对您来说可有可无', options: [{t:'A.非常认同',v:2},{t:'B.认同',v:1},{t:'C.不认同',v:-1},{t:'D.非常不认同',v:-2}] },
            { type: 'choice', title: '29. 您需要特定的睡姿才能入眠', options: [{t:'A.非常认同',v:-2},{t:'B.认同',v:-1},{t:'C.不认同',v:1},{t:'D.非常不认同',v:2}] },
            { type: 'choice', title: '30. 您平时有午休的习惯', options: [{t:'A.非常认同',v:2},{t:'B.认同',v:0},{t:'C.不认同',v:0},{t:'D.非常不认同',v:0}] },
            { type: 'text', title: '31. 您最近经常做怪梦吗，内容是', placeholder: '请输入你最近梦到的内容...' },
        ];

        // 将原来的 bgmAudio 替换为：
const whisperAudio = new Audio('耳语.mp3');
whisperAudio.loop = false; // 只播放一遍
let isWhisperPlaying = false;

        // 渲染题目
        function renderQuestion() {
            if (currentIndex >= questions.length) {
                finishTest();
                return;
            }
document.getElementById('optionsList').innerHTML = ""; 
            const q = questions[currentIndex];
            
            // 姓名和日期（0.1, 0.2）不参与进度条计算
            let progress = (currentIndex / (questions.length - 2)) * 100;
            if (currentIndex === 0 || currentIndex === 1) {
                progress = 0; 
            }
            
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('currentQuestion').innerText = `第 ${Math.max(0, currentIndex - 1)} 题`;
            document.getElementById('questionCount').innerText = `共31题`;
            
            let title = q.title;
            // 特殊处理 23 题，实时读取日期计算出的星座
            if (currentIndex === 24) {
                title = '23. 您的星座是 ' + (window.__userZodiac || '未知');
            }
         if (q.special === 'name_swap') {
    const name = userName || '未知';

    // 先显示 "亲朋好友"（黑色，开始闪烁）

    // 1.2秒后（闪烁3次后）变为红色姓名

} else {

}


       if (q.type === 'text') {
    const inputGroup = document.createElement('div');
    inputGroup.className = 'input-group';
    inputGroup.innerHTML = `<input type="text" id="textInput" placeholder="${q.placeholder || ''}" style="font-family: inherit; font-size: 16px; padding: 12px; border: 1px solid var(--border); border-radius: 8px; width: 100%; box-sizing: border-box; background: var(--bg-color);" maxlength="50">`;
    optionsList.appendChild(inputGroup);
    
    const inputEl = document.getElementById('textInput');
    
    // 第31题：输入任何字符都按顺序显示指定文字，限制50字

        const fixedText = '椅肯拿或然步近蓝度展且呼层片使式现管系即知性没问原相面群织准研别总细回此实主角根方入半王车满安象斯件位各论权采光多布队认林果';

        inputEl.addEventListener('input', function() {

        });

}
        
            else if (q.type === 'date') {

                    }

                    if (currentIndex === 1) {
                        userBirthday = val;
                        window.__userZodiac = calculateZodiac(val);
                    }
                    nextQuestion(0); 
                };
                optionsList.appendChild(btn);
            } 
            
            else {
                q.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerText = opt.t;
                    btn.onclick = () => handleChoice(opt.v);
                    optionsList.appendChild(btn);
                });
            }
        }

        function handleChoice(value) {
            const q = questions[currentIndex];

          if (currentIndex === 13) {
    // 存储选项字母而不是数值
    const q12Opts = questions[13].options;
    for (let i = 0; i < q12Opts.length; i++) {
        if (q12Opts[i].v === value) {
            answers['q12'] = q12Opts[i].t.charAt(0);
            break;
        }
    }
}
        if (q.special === 'whisper') {
    if (!isWhisperPlaying) {
        whisperAudio.play();
        isWhisperPlaying = true;
    }
    // 直接进入下一题，音频在后台继续播放
    nextQuestion(value);
    return;
}

      if (q.special === 'forced_A') {
    // 短暂停顿后显示全屏文字
    setTimeout(() => {
        // 创建全屏遮罩
        const overlay = document.createElement('div');
        overlay.id = 'forcedOverlay';
        overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            align-content: center;
            z-index: 99999;
            padding: 20px;
            box-sizing: border-box;
        `;
        
        // 生成大量 "你忘了我吗？"
        let text = '';
        for (let i = 0; i < 80; i++) {
            text += '你忘了我吗？ ';
        }
        
        overlay.innerText = text;
        overlay.style.color = '#ff0000';
        overlay.style.fontSize = '28px';
        overlay.style.fontWeight = 'bold';
        overlay.style.textAlign = 'center';
        overlay.style.wordBreak = 'break-word';
        overlay.style.lineHeight = '1.8';
        
        document.body.appendChild(overlay);
        
        // 2.5秒后移除并进入下一题
        setTimeout(() => {
            overlay.remove();
            nextQuestion(0);
        }, 2500);
    }, 500);
    return;
}
            if (q.special === 'audit_mode') {
                document.body.classList.add('audit-mode');
                document.getElementById('questionTitle').innerText = "资格审查问卷";
                setTimeout(() => {
                    document.body.classList.remove('audit-mode');
                    nextQuestion(value);
                }, 2500);
                return;
            }

           
    // 获取所有选项按钮
   if (q.special === 'wake_up') {
    // 获取所有选项按钮，只改文字
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(btn => {
        btn.innerText = '醒来！！！';
          btn.style.color = '#ff0000';
           
        btn.style.pointerEvents = 'none'; // 禁止再次点击
    });
    
    // 1.5秒后进入下一题
    setTimeout(() => {
        nextQuestion(value);
    }, 1500);
    return;
}

          if (q.special === 'check_12') {
    const currentValue = value;
    const q12Value = answers['q12'];
    
    // 获取当前点击的选项字母（A/B/C/D）
    let currentLetter = '';
    const currentOpts = questions[currentIndex].options;
    for (let i = 0; i < currentOpts.length; i++) {
        if (currentOpts[i].v === value) {
            currentLetter = currentOpts[i].t.charAt(0);
            break;
        }
    }
    
    // 获取第12题对应的选项字母（A/B/C/D）
    let q12Letter = '';
    const q12Opts = questions[13].options;
    for (let i = 0; i < q12Opts.length; i++) {
        if (q12Opts[i].v === q12Value) {
            q12Letter = q12Opts[i].t.charAt(0);
            break;
        }
    }
    
    // 比较字母是否一致
    if (currentLetter !== q12Letter) {
        // 创建自定义弹窗
        const modal = document.createElement('div');
        modal.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            backdrop-filter: blur(4px);
        `;
        
        const modalBox = document.createElement('div');
        modalBox.style.cssText = `
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 48px 32px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        `;
        
        modalBox.innerHTML = `
            <div style="font-size: 20px; font-weight: 600; color: #1e293b; margin-bottom: 12px;">提醒</div>
            <div style="font-size: 16px; color: #475569; margin-bottom: 28px; line-height: 1.6;">
                您还记得第12题选了什么吗？
            </div>
            <div style="display: flex; gap: 12px; justify-content: center;">
                <button id="rememberBtn" style="flex:1; padding: 12px 20px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;">记得</button>
                <button id="forgetBtn" style="flex:1; padding: 12px 20px; background: #e2e8f0; color: #1e293b; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit;">不记得</button>
            </div>
        `;
        
        modal.appendChild(modalBox);
        document.body.appendChild(modal);
        
        document.getElementById('rememberBtn').onclick = function() {
            modal.remove();
            nextQuestion(currentValue);
        };
        
        document.getElementById('forgetBtn').onclick = function() {
            modal.remove();
            nextQuestion(currentValue);
        };
        
        return;
    }
    
    // 一致，直接进入下一题
    nextQuestion(value);
    return;
}
if (q.special === 'disaster_countdown') {
    // 播放警报音效
    const alarmAudio = new Audio('警报.mp3');
    alarmAudio.loop = false;
    alarmAudio.play();
     const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(btn => {
        btn.style.pointerEvents = 'none';
        btn.style.opacity = '0.6';
    });
    const notice = document.getElementById('disasterNotice');
    const msgEl = document.getElementById('disasterMsg');
    
    notice.classList.add('show');
    let count = 5;
    msgEl.innerText = `距离灾难来临还有 ${count}`;
    
    const countdownInterval = setInterval(() => {
        count--;
        if (count >= 1) {
            msgEl.innerText = `距离灾难来临还有 ${count}`;
        } else {
            clearInterval(countdownInterval);
            msgEl.innerText = `灾难降临！`;
            notice.classList.add('glitch');
            
            setTimeout(() => {
                alarmAudio.pause();
                alarmAudio.currentTime = 0;
                notice.classList.remove('glitch');
                notice.classList.remove('show');
                nextQuestion(value);
            }, 5000);
        }
    }, 1000);
    
    return;
}
            if (q.special === 'input_glitch') {
                alert("随机输入法崩溃：" + String.fromCharCode(Math.floor(Math.random() * 65535)));
                nextQuestion(value);
                return;
            }

            nextQuestion(value);
        }

        function nextQuestion(value) {
            const numericValue = typeof value === 'number' ? value : parseInt(value, 10) || 0;
            score += numericValue;
            currentIndex++;
            renderQuestion();
        }

        function showOverlay(id) {
            document.getElementById(id).classList.add('show');
        }
        function hideOverlay(id) {
            document.getElementById(id).classList.remove('show');
        }

        function finishTest() {
            document.getElementById('questionTitle').innerText = "您已完成32题的内容，正在跳转结果";
            document.getElementById('optionsList').innerHTML = "";
            
            setTimeout(() => {
                let type = "";
                let desc = "";
                if (score >= 30) { type = "筑梦师"; desc = "清醒梦境 / 清晰掌控"; }
                else if (score >= 20) { type = "旅梦人"; desc = "极浅梦境 / 朦胧感知"; }
                else if (score >= 10) { type = "控梦雏"; desc = "浅度梦境 / 初窥门径"; }
                else if (score >= 0) { type = "无梦者"; desc = "标准梦境 / 安静祥和"; }
                else if (score >= -10) { type = "太白星"; desc = "梦笔生花 / 灵感闪现"; }
                else if (score >= -20) { type = "卢先生"; desc = "黄粱一梦 / 虚幻缥缈"; }
                else if (score >= -30) { type = "华子休"; desc = "庄周梦蝶 / 物我两忘"; }
                else { type = "Limbo"; desc = "混沌边缘 / 深度迷失"; }
                
                document.getElementById('mainContainer').innerHTML = `
                    <div class="result-box">
                        <div class="result-title">测评结果</div>
                        <div class="type-badge">${type}</div>
                        <div class="result-desc">${desc}</div>
                        <div class="result-desc">最终得分：${score}</div>
                        <p style="color: #aaa; font-size: 12px;">（BGM 依旧在耳边回荡，你确定你真的醒了吗？）</p>
                    </div>
                `;
            }, 1000);
        }

        // 开始
        renderQuestion();
    </script>
</body>
</html>
